name: Keep backend awake

# Render's free tier spins the backend down after ~15 min idle. This pings the
# health endpoint every ~12 min so it stays warm 24/7. (An external monitor like
# UptimeRobot is the steadier primary — this is the in-repo backup.)
on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          URL="https://shuraim-backend.onrender.com/api/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 "$URL" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 25
          done
          echo "Health did not return 200 (instance may have been waking). Not failing the job."
