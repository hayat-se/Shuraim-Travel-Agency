<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="destGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="destDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Base Rectangle -->
  <rect width="800" height="600" fill="url(#destGradient)"/>
  
  <!-- Decorative Circles -->
  <circle cx="150" cy="100" r="80" fill="url(#destDark)" opacity="0.6"/>
  <circle cx="700" cy="500" r="120" fill="url(#destDark)" opacity="0.5"/>
  <circle cx="400" cy="300" r="60" fill="url(#destDark)" opacity="0.4"/>
  
  <!-- Globe/World Icon -->
  <g transform="translate(400, 280)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    
    <!-- Globe -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3"/>
    
    <!-- Simplified continents -->
    <path d="M -20,-30 Q -10,-20 0,-25 L 10,-20 L 20,-30 Z" fill="rgba(255,255,255,0.6)"/>
    <path d="M -40,10 Q -30,5 -20,15 L -10,10 Q -15,20 -30,25 Z" fill="rgba(255,255,255,0.6)"/>
    <path d="M 25,-5 Q 35,0 40,10 L 35,15 Q 30,5 25,10 Z" fill="rgba(255,255,255,0.6)"/>
    
    <!-- Latitude lines -->
    <ellipse cx="0" cy="0" rx="70" ry="20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="70" ry="40" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>
  
  <!-- Camera Icon -->
  <g transform="translate(400, 480)">
    <!-- Camera body -->
    <rect x="-45" y="-30" width="90" height="70" rx="8" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5"/>
    
    <!-- Lens -->
    <circle cx="0" cy="10" r="28" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5"/>
    <circle cx="0" cy="10" r="20" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    
    <!-- Flash -->
    <rect x="30" y="-20" width="12" height="12" rx="2" fill="rgba(255,255,255,0.5)"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="570" font-family="'Manrope', sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.8)" text-anchor="middle">
    Destination Image
  </text>
</svg>
